<style>
/* VOICE: тихий, созерцательный, как обои в Sajda
   IDEA: картина маслом — каждый аят на своём холсте

:root{color-scheme:dark;--e:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--mut:rgba(255,255,255,.72);--glass:rgba(10,12,20,.32);--edge:rgba(255,255,255,.16);--ok:#7fe0b8}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:#0b0f1c;color:#fff;font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column;min-height:100dvh}
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;transition:opacity 1.8s ease}
.bg svg,.bg img{width:100%;height:100%;display:block;object-fit:cover}
.shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.05) 30%,rgba(0,0,0,.15) 60%,rgba(0,0,0,.6))}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:max(16px,env(safe-area-inset-top)) max(5vw,16px) 16px}
.links{display:flex;gap:6px;align-items:center}
.brand{font-weight:600;font-size:22px;letter-spacing:-.5px;line-height:1;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.3)}.brand i{font-style:normal;color:#f6c25b;margin:0 .5px;display:inline-block;animation:dot 1.1s .7s var(--spring) backwards}
@media(max-width:360px){.brand{font-size:19px}}
.chip{font:500 14px Inter,sans-serif;color:#fff;text-decoration:none;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:99px;padding:0 13px;min-height:38px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;transition:transform .2s var(--e),background .25s}
.lang{position:relative;display:flex;background:var(--glass);border:1px solid var(--edge);border-radius:99px;padding:3px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lang::before{content:'';position:absolute;top:3px;left:3px;width:40px;bottom:3px;border-radius:99px;background:#fff;transition:transform .6s var(--e)}
.lang.r::before{transform:translateX(40px)}
.lang button{position:relative;font:600 13px Inter,sans-serif;color:var(--mut);background:none;border:0;border-radius:99px;width:40px;min-height:32px;cursor:pointer;transition:color .5s}
.lang button.on{color:#111}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px max(5vw,16px);transition:transform .7s var(--e),opacity .7s var(--e)}
body.modal main{transform:scale(.96);opacity:.55}
header{animation:down 1.1s var(--e) backwards}
footer{animation:rise 1.1s .3s var(--e) backwards}
.card{max-width:640px;width:100%;text-align:center;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border-radius:28px;padding:clamp(22px,5vw,40px) clamp(18px,5vw,40px) 16px;animation:rise 1.2s .1s var(--e) backwards;touch-action:pan-y}
.card.drag{-webkit-user-select:none;user-select:none}
.tag{display:inline-block;font-size:13px;font-weight:600;color:#111;background:#fff;border-radius:99px;padding:3px 12px;margin-bottom:16px}
.ar{font-family:Amiri,serif;font-size:var(--fa,clamp(28px,6.5vw,42px));line-height:var(--la,1.9);direction:rtl;margin:0 0 20px;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.tr{font-size:var(--ft,clamp(17px,2.6vw,20px));line-height:1.5;margin:0 0 16px;text-wrap:balance}
.ref{font-size:14px;color:var(--mut);margin:0}
.ref a{color:var(--mut);text-underline-offset:3px}
.by{font-size:12.5px;color:var(--mut);margin:6px 0 0}.card.loading{opacity:.55;transition:opacity .2s}
.sub{font-size:13px;color:var(--mut);margin:6px 0 0}
.sub button{font:inherit;color:#fff;background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
.tools{display:flex;justify-content:center;gap:4px;margin-top:8px}
.ti{width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center;transition:background .25s,color .25s,transform .2s var(--e)}
.ti:hover{background:rgba(255,255,255,.1);color:#fff}
.ti.on{color:#fff;animation:breath 2.4s ease-in-out infinite}
.ti.ok{color:var(--ok)}
.ti svg{width:20px;height:20px}
footer{padding:10px max(5vw,20px) max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.ic{width:54px;height:54px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none;transition:transform .2s var(--e)}
.ic svg{width:22px;height:22px}
.ic.on{background:#fff;color:#111}
.fact{font:600 15px Inter,sans-serif;color:#fff;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:99px;padding:0 18px;min-height:54px;display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;transition:transform .2s var(--e),background .25s}.fact svg{width:20px;height:20px;color:#f6c25b}.fact:active{transform:scale(.96)}
.ftag{display:inline-block;font-size:13px;font-weight:600;color:#111;background:#f6c25b;border-radius:99px;padding:3px 12px;margin-bottom:14px}.ftext{font-size:20px;line-height:1.5;margin:0 0 12px;color:#fff;text-wrap:pretty}.fsrc{font-size:13px;color:var(--mut);margin:0 0 18px}
.go{font:600 16px Inter,sans-serif;background:#fff;color:#111;border:0;border-radius:99px;padding:0 30px;min-height:54px;cursor:pointer;transition:transform .2s var(--e),box-shadow .3s;white-space:nowrap}
.go:active,.ic:active,.chip:active,.btn:active,.ti:active,.lang button:active{transform:scale(.95)}
.btn{transition:transform .2s var(--e)}
@media(hover:hover){.chip:hover,.fact:hover{background:rgba(255,255,255,.14)}.go:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.25)}.go:active{transform:scale(.96)}}
.note{font-size:12.5px;color:var(--mut);text-align:center;max-width:46ch;margin:0}
button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:3px}
.toast{z-index:9;position:fixed;left:50%;top:76px;transform:translate(-50%,-12px) scale(.94);background:#fff;color:#111;font-size:14px;padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .35s,transform .6s var(--e);white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,0);display:flex;visibility:hidden;pointer-events:none;align-items:flex-end;justify-content:center;z-index:5;touch-action:manipulation;transition:background .55s ease,visibility 0s .7s}
.sheet.open{visibility:visible;pointer-events:auto;background:rgba(0,0,0,.55);transition:background .55s ease}
.sheet .panel{transform:translateY(105%);transition:transform .65s cubic-bezier(.32,.72,0,1);touch-action:pan-y}
.sheet.open .panel{transform:none}
.panel.still{touch-action:none}
.panel{background:#12151f;border:1px solid var(--edge);border-radius:26px 26px 0 0;padding:18px 22px max(24px,env(safe-area-inset-bottom));max-width:520px;width:100%;max-height:94dvh;overflow:auto}
.grab{position:relative;width:40px;height:5px;border-radius:9px;background:var(--edge);margin:0 auto 16px;touch-action:none;cursor:grab}.grab::before{content:'';position:absolute;inset:-16px -70px}
.panel h2{font-size:22px;margin:0 0 8px;line-height:1.2}
.muted{margin:0 0 14px;color:var(--mut)}
.pct{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.pct b{flex:none;font-size:40px;line-height:1;color:var(--ok)}
.btn{display:flex;justify-content:center;align-items:center;width:100%;min-height:52px;border-radius:14px;font:600 16px Inter,sans-serif;text-decoration:none;border:0;cursor:pointer}
.btn.pri{background:#fff;color:#111;margin-bottom:10px}
.btn.sec{background:transparent;color:#fff;border:1px solid var(--edge)}
.kaspi{text-align:center;border:1px solid var(--edge);border-radius:16px;padding:16px;margin-bottom:10px}.kaspi .kl{display:inline-block;background:#f14635;color:#fff;font-weight:700;font-size:13px;border-radius:8px;padding:2px 10px;margin-bottom:8px}.kaspi b{display:block;font-size:26px;letter-spacing:.5px;margin-bottom:12px;white-space:nowrap}.kaspi .muted{margin:4px 0 0;font-size:14px}
.soon{border:1px dashed var(--edge);border-radius:14px;padding:12px;text-align:center;color:var(--mut);margin-bottom:10px}
/* зикр */
.zk .panel{text-align:center}
.segs{display:flex;gap:6px;margin:0 auto 6px;max-width:260px}
.segs i{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.segs i b{display:block;height:100%;background:var(--ok);transition:width .55s var(--e)}
.stage{font-size:13px;color:var(--mut);margin:0 0 14px}
.zar{font-family:Amiri,serif;font-size:38px;line-height:1.5;margin:0;direction:rtl;color:#fff}
.long .zar{font-size:24px;line-height:1.8}.long .ztr{font-size:15px;line-height:1.5;margin-bottom:4px}.long .zru{font-size:14px}
.ztr{font-size:19px;font-weight:600;margin:0;color:#fff}
.zru{color:var(--mut);margin:0 0 16px}
.tap{position:relative;width:min(230px,58vw);aspect-ratio:1;margin:0 auto 14px;border-radius:50%;border:0;background:radial-gradient(circle at 50% 35%,#24304a,#0f1422);color:#fff;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .12s var(--e);overflow:hidden}
.tap.done{animation:glow 1.8s ease-out}
.rip{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(127,224,184,.28);pointer-events:none}
.tap.press{transform:scale(.97)}
.tap,.tap *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tap .n{font-size:56px;font-weight:600;line-height:1;display:inline-block;font-variant-numeric:tabular-nums}
.tap .of{font-size:14px;color:var(--mut)}
.fin{color:var(--ok);font-weight:600;min-height:24px;margin:0 0 10px}
.zrow{display:flex;gap:10px}.zrow .btn{flex:1}
/* картинка */
.shot{display:block;width:auto;max-width:100%;max-height:62dvh;margin:0 auto 14px;border-radius:16px;-webkit-touch-callout:default;user-select:auto}
.wait{height:40dvh;display:grid;place-items:center;color:var(--mut);animation:pulse 1.6s ease-in-out infinite}
.shot{animation:pop .8s var(--e) both;-webkit-user-drag:none}
body.tight header{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:6px}body.tight main{padding-top:2px;padding-bottom:2px}body.tight .card{padding:14px 14px 8px}body.tight .tag{margin-bottom:8px}body.tight .ar{margin-bottom:10px}body.tight .tr{margin-bottom:8px}body.tight .by,body.tight .sub{margin-top:2px}body.tight .tools{margin-top:0}body.tight .ti{height:38px}body.tight footer{padding-top:6px;gap:6px}body.tight .note{font-size:11.5px}body.tight .note+.note{display:none}body.tight .go,body.tight .fact{min-height:48px}
.in{animation:in .8s var(--e)}
.stag>*{animation:rise 1.1s var(--e) both}
.stag>.ar{animation-name:blurin;animation-duration:1.4s}
.stag>:nth-child(2){animation-delay:.1s}.stag>:nth-child(3){animation-delay:.2s}.stag>:nth-child(4){animation-delay:.3s}.stag>:nth-child(5){animation-delay:.38s}.stag>:nth-child(6){animation-delay:.46s}.stag>:nth-child(7){animation-delay:.54s}
@keyframes in{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes blurin{from{opacity:0;transform:translateY(10px) scale(.98);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes dot{from{opacity:0;transform:scale(0)}}
@keyframes pulse{50%{opacity:.4}}
@keyframes breath{0%,100%{background:rgba(255,255,255,.08)}50%{background:rgba(255,255,255,.2)}}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(127,224,184,.55)}to{box-shadow:0 0 0 28px rgba(127,224,184,0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}
.splash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;background:radial-gradient(130% 75% at 50% 100%,#4a3560 0%,#1b1f3a 48%,#0b0f1c 100%);transition:opacity 1s var(--e),transform 1.2s var(--e),filter 1s var(--e);animation:spfail .3s 7s forwards}
.splash.bye{opacity:0;transform:scale(1.08);filter:blur(8px);pointer-events:none}
.sp-stars{position:absolute;inset:0;background-image:radial-gradient(1.4px 1.4px at 12% 16%,#fff,transparent),radial-gradient(1px 1px at 28% 32%,#fff,transparent),radial-gradient(1.6px 1.6px at 44% 10%,#fff,transparent),radial-gradient(1px 1px at 63% 24%,#fff,transparent),radial-gradient(1.3px 1.3px at 81% 14%,#fff,transparent),radial-gradient(1px 1px at 90% 38%,#fff,transparent),radial-gradient(1.2px 1.2px at 8% 44%,#fff,transparent),radial-gradient(1px 1px at 35% 52%,#fff,transparent),radial-gradient(1.5px 1.5px at 72% 48%,#fff,transparent),radial-gradient(1px 1px at 55% 62%,#fff,transparent),radial-gradient(1.2px 1.2px at 20% 68%,#fff,transparent),radial-gradient(1px 1px at 86% 66%,#fff,transparent);animation:stars 2s .1s ease-out both,twinkle 3.2s 2.1s ease-in-out infinite alternate}
.sp-sun{position:absolute;left:50%;bottom:-34vmin;width:96vmin;height:62vmin;margin-left:-48vmin;border-radius:50%;background:radial-gradient(closest-side,rgba(246,194,91,.95),rgba(246,194,91,.38) 55%,rgba(246,194,91,0));animation:sunrise 2.2s .1s var(--e) both}
.sp-mark{position:relative;font:600 46px/1 Inter,system-ui,sans-serif;letter-spacing:-1.5px;color:#fff;white-space:nowrap}
.sp-mark span{display:inline-block;animation:rise 1.1s var(--e) both}.sp-mark span:first-child{animation-delay:.35s}.sp-mark span:last-child{animation-delay:.95s}
.sp-mark i{font-style:normal;color:#f6c25b;display:inline-block;margin:0 1px;text-shadow:0 0 18px rgba(246,194,91,.9);animation:spdot 1.2s .65s var(--spring) both}
.sp-bis{position:relative;font-family:Amiri,serif;font-size:24px;line-height:1.6;color:rgba(255,255,255,.82);margin:0;direction:rtl;animation:blurin 1.3s 1.2s var(--e) both}
body.boot>header,body.boot>main,body.boot>main *,body.boot>footer,body.boot .brand i{animation-play-state:paused}
@keyframes sunrise{from{opacity:0;transform:translateY(30vmin) scale(.8)}to{opacity:1;transform:none}}

@keyframes stars{from{opacity:0}to{opacity:.8}}

@media(max-width:400px){.chip{padding:0 11px;font-size:13px}.go{padding:0 20px}.fact{padding:0 14px}}
</style>
</head>

const sky=(...c)=>`${grad('g',...c)}<rect width="400" height="800" fill="url(#g)"/>`;
const ridge=(y,amp,col,n=7)=>{let d=`M0 ${y}`;for(let i=1;i<=n;i++){const x=i*400/n;d+=` Q${x-200/n} ${y-amp*(0.4+rnd())} ${x} ${y+amp*(rnd()-.5)*.6}`}return `<path d="${d} L400 800 L0 800Z" fill="${col}"/>`};
const peaks=(y,col,snow,pts)=>{let d=`M0 ${y}`;pts.forEach(([x,h])=>{d+=` L${x} ${y-h}`});d+=` L400 ${y} L400 800 L0 800Z`;let s='';if(snow)pts.forEach(([x,h],i)=>{if(h>120)s+=`<path d="M${x-h*.18} ${y-h*.78} L${x} ${y-h} L${x+h*.2} ${y-h*.76} L${x+h*.08} ${y-h*.82} L${x-h*.05} ${y-h*.74}Z" fill="${snow}"/>`});return `<path d="${d}" fill="${col}"/>${s}`};

const clouds=(n,y0,y1,col,op)=>Array.from({length:n},()=>{const x=rnd()*400,y=y0+rnd()*(y1-y0),w=60+rnd()*90;return `<ellipse cx="${x}" cy="${y}" rx="${w}" ry="${10+rnd()*16}" fill="${col}" opacity="${op}"/><ellipse cx="${x-w*.3}" cy="${y-8}" rx="${w*.45}" ry="${12+rnd()*10}" fill="${col}" opacity="${op*.8}"/>`}).join('');
const rays=(cx,cy,col,n=9,spread=.16)=>Array.from({length:n},(_,i)=>{const a=(i-(n-1)/2)*spread+Math.PI/2,w=.03+rnd()*.02;return `<polygon points="${cx},${cy} ${cx+Math.cos(a-w)*900},${cy+Math.sin(a-w)*900} ${cx+Math.cos(a+w)*900},${cy+Math.sin(a+w)*900}" fill="${col}" opacity="${.07+rnd()*.1}"/>`}).join('');

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

['Первая мечеть, построенная Пророком (с.а.с.), — мечеть Куба возле Медины.','Пайғамбар (с.ғ.с.) салған алғашқы мешіт — Мединаның маңындағы Құба мешіті.','Сира'],
['Первым муэдзином в истории ислама был Билал ибн Рабах.','Ислам тарихындағы алғашқы азаншы — Біләл ибн Рабах.','Сира'],
['Первым человеком, принявшим ислам, была Хадиджа — жена Пророка (с.а.с.).','Исламды алғаш қабылдаған адам — Пайғамбардың (с.ғ.с.) жұбайы Хадиша анамыз.','Сира'],
['Пророк Мухаммад (с.а.с.) родился в Мекке около 570 года, в так называемый «год Слона».','Мұхаммед Пайғамбар (с.ғ.с.) шамамен 570 жылы Меккеде, «Піл жылы» дүниеге келді.','Сира'],
['В Коране по имени названы 25 пророков.','Құранда 25 пайғамбардың есімі аталған.','Құран'],
['Закят обычно составляет 2,5% от накоплений, которые превысили нисаб и пролежали лунный год.','Зекет әдетте нисабтан асып, бір қамари жыл тұрған жинақтың 2,5%-ы.','Фикһ'],
['После намаза Пророк (с.а.с.) учил говорить 33 раза «СубханАллах», 33 «Альхамдулиллях», 33 «Аллаху Акбар» и завершать сотней — как в нашем зикре.','Пайғамбар (с.ғ.с.) намаздан кейін 33 рет «СубханАллаһ», 33 «Әлхамдулиллаһ», 33 «Аллаһу Акбар» айтып, жүзіншісін тәһлилмен аяқтауды үйретті — біздің зікірдегідей.','Муслим, 597'],
['«Чистота — половина веры».','«Тазалық — иманның жартысы».','Муслим, 223'],
['«Лучший из вас — тот, кто изучает Коран и обучает ему».','«Сендердің ең жақсыларың — Құранды үйреніп, оны басқаларға үйреткендерің».','Бухари, 5027'],
['Пятничную молитву (джума) Коран велит не пропускать ради торговли.','Құран жұма намазын сауда үшін қалдырмауды бұйырады.','Құран 62:9'],
['Ханафитский мазхаб, которого придерживается большинство мусульман Казахстана, основал имам Абу Ханифа (699–767).','Қазақстан мұсылмандарының көпшілігі ұстанатын ханафи мәзһабының негізін Әбу Ханифа (699–767) қалаған.','Тарих'],
['Мавзолей Ходжи Ахмеда Ясави в Туркестане — объект Всемирного наследия ЮНЕСКО с 2003 года.','Түркістандағы Қожа Ахмет Ясауи кесенесі 2003 жылдан бері ЮНЕСКО-ның Дүниежүзілік мұрасы тізімінде.','ЮНЕСКО'],
['Коран был собран в единую книгу при халифе Абу Бакре, а единый образец текста утверждён при халифе Усмане.','Құран халифа Әбу Бәкір тұсында бір кітапқа жиналып, бірыңғай нұсқасы халифа Османның тұсында бекітілді.','Тарих'],
['Мусульманское приветствие «Ас-саляму алейкум» означает «Мир вам».','«Ассаламу ағалейкум» сәлемі «Сендерге амандық болсын» дегенді білдіреді.','Құран 24:61'],
['Курбан-айт отмечается 10-го числа месяца Зуль-хиджа, на следующий день после стояния на Арафате.','Құрбан айт Зұлхижжа айының 10-күні, Арафатта тұрудың ертеңінде тойланады.','Фикһ'],
['Суры Корана делят на мекканские и мединские — по тому, в какой период они были ниспосланы Пророку (с.а.с.).','Құран сүрелері Пайғамбарға (с.ғ.с.) қай кезеңде түскеніне қарай меккелік және мәдинелік болып бөлінеді.','ДУМК'],
['«Улыбка твоему брату — это садака».','«Бауырыңа күлімсіреуің — садақа».','Тирмизи, 1956']
];

const SRC={'ДУМК':['ДУМК, muftyat.kz','ҚМДБ, muftyat.kz'],'Құран':['Коран','Құран'],'Сира':['Сира','Сира'],'Тарих':['История','Тарих'],'Фикһ':['Фикх','Фиқһ'],'ЮНЕСКО':['ЮНЕСКО','ЮНЕСКО']};
let fbag=[],fcur=-1;
function nextFact(){if(!fbag.length){fbag=F.map((_,i)=>i);for(let i=fbag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fbag[i],fbag[j]]=[fbag[j],fbag[i]]}if(fbag[fbag.length-1]===fcur)fbag.unshift(fbag.pop())}fcur=fbag.pop();drawFact()}
function drawFact(){if(fcur<0)return;const[ru,kz,s]=F[fcur];const li=L==='kz'?1:0;
  const src=s.replace(/^(ДУМК|Құран|Сира|Тарих|Фикһ|ЮНЕСКО)/,m=>SRC[m][li]).replace('Бухари',li?'Бұхари':'Бухари').replace('Тирмизи',li?'Тирмизи':'Тирмизи');
  $('ftext').textContent=L==='kz'?kz:ru;$('fsrc').textContent=`${t('src')}: ${src}`;$('ftext').classList.remove('in');void $('ftext').offsetWidth;$('ftext').classList.add('in')}
$('fbtn').addEventListener('click',()=>{nextFact();open($('fsheet'))});
$('fnext').addEventListener('click',nextFact);

/* ---------- язык ---------- */
function applyLang(){
  document.documentElement.lang=L==='kz'?'kk':'ru';
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));document.querySelector('.lang').classList.toggle('r',L==='ru');
  $('donSlot').innerHTML=`<div class="kaspi"><span class="kl">Kaspi</span><b>${esc(KASPI)}</b><button class="btn pri" id="kcp" type="button">${esc(t('kcopy'))}</button><p class="muted">${esc(t('khow'))}</p></div>`;
  $('kcp').onclick=async()=>{try{await navigator.clipboard.writeText(KASPI.replace(/\s/g,''));show(t('copied'))}catch(e){show(t('nocopy'))}};
  note.textContent=t('note');
  if(C)render(false);zdraw();drawFact();
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{if(L===b.dataset.l)return;stop();L=b.dataset.l;try{localStorage.setItem('lang',L)}catch(e){}applyLang();anim(card.firstElementChild,[{opacity:0,filter:'blur(4px)'},{opacity:1,filter:'none'}],{duration:600,easing:EASE})}));

applyLang();showDaily();
}
</script>
